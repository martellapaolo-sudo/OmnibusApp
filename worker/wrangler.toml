name            = "omnibus-worker"
main            = "src/index.js"
compatibility_date = "2024-09-23"

# ─── D1 Database ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "omnibus-db"
database_id   = "9d09d925-ead4-4a4b-b25c-cc26839df207"

# ─── Environment variables (non-secret) ──────────────────────────────────────
# I secret si impostano con:
#   npx wrangler secret put ALLOWED_ORIGIN
# NON metterli qui in chiaro.

# ─── Workers Free tier limits ────────────────────────────────────────────────
# 100.000 richieste/giorno, 10ms CPU/richiesta - sufficiente per uso personale.
